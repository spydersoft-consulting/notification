## Build Pipeline - builds the solution, publishes both service images (API +
## Hub), the combined notification OCI chart, AND the Spydersoft.Notification.
## Contracts/Client NuGet packages, all from one build number. Same shape as
## the audit repo's pipeline (two controllers, one shared release cadence).
resources:
  repositories:
    - repository: templates
      type: github
      endpoint: spydersoft-gh
      name: spydersoft-consulting/azure-devops-templates
    - repository: helmfileconfig
      type: github
      endpoint: spydersoft-gh
      name: spydersoft-consulting/platform-helm-config

variables:
  - group: nuget-spydersoft-github

trigger:
  tags:
    include:
      - "*"
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/*
      - scripts/*

pr:
  branches:
    include:
      - main

extends:
  template: pipelines/build-multi-container/v1.yml@templates
  parameters:
    vmImage: ubuntu-latest
    gitVersionSpec: "6.0.x"
    netCoreVersion: "10.0.x"
    externalFeedCredentials: SpydersoftGithub
    nugetConfigPath: "$(Build.SourcesDirectory)/nuget.config"

    buildProject: src/Spydersoft.Notification.slnx

    prebuildSteps:
      - task: UseDotNet@2
        displayName: Install .NET 8 SDK (net8.0 multi-targeted tests/pack)
        inputs:
          packageType: sdk
          version: 8.0.x
      - task: UseDotNet@2
        displayName: Install .NET 9 SDK (net9.0 multi-targeted tests/pack)
        inputs:
          packageType: sdk
          version: 9.0.x

    projectsToPack: "**/*.csproj;!**/*.UnitTests.csproj;!**/*.AppHost.csproj;!**/Spydersoft.NotificationApi.csproj;!**/Spydersoft.NotificationHub.csproj;!**/Spydersoft.Notification.TokenGenerator.csproj"
    externalPublishUrl: $(nuget-feed-url)
    externalPublishApiKey: $(nuget-feed-api-key)

    publishProjects:
      - name: notification_api
        project: src/Spydersoft.NotificationApi/Spydersoft.NotificationApi.csproj
        artifactName: notificationApi
      - name: notification_hub
        project: src/Spydersoft.NotificationHub/Spydersoft.NotificationHub.csproj
        artifactName: notificationHub

    executeTests: true
    testProjects: "src/**/*.UnitTests/*.csproj"

    sonarProjectKey: spydersoft-consulting_notification
    sonarProjectName: Spydersoft.Notification
    useSonarCloud: true
    sonarCloudOrganization: spydersoft-consulting
    sonarEndpointName: sonarcloud-spydersoft
    sonarExtraProperties: |
      sonar.projectKey=spydersoft-consulting_notification
      sonar.test.inclusions=**/*.UnitTests/**
      sonar.coverage.exclusions=**/*.UnitTests/**,**/*.AppHost/**,**/Generated/**
      sonar.exclusions=**/Generated/**
      sonar.scanner.scanAll=false

    containerRegistryName: github-spydersoft-docker
    dockerImages:
      - name: notification_api
        dockerImageName: spydersoft-consulting/notification-api
        dockerFilePath: Dockerfile.api
        artifactName: notificationApi
        artifactZipName: Spydersoft.NotificationApi
      - name: notification_hub
        dockerImageName: spydersoft-consulting/notification-hub
        dockerFilePath: Dockerfile.hub
        artifactName: notificationHub
        artifactZipName: Spydersoft.NotificationHub

    helmCharts:
      - name: notification
        chartPath: charts/notification

    helmfileRepoName: helmfileconfig
    updateHelmConfigDependsOn:
      - docker_publish
      - chart_publish

    # Three build shapes (same convention as audit/pitstop's pipeline-ci.yml):
    #  - PR: build/test/sonar only, no publish, no helm-config update.
    #  - main: beta build -> publish images+chart+NuGet packages, update
    #    helm-config's test environment.
    #  - anything else (a tag push): release build -> publish images+chart+
    #    NuGet packages, also update helm-config's test environment.
    ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      updateHelmConfig: false
      buildAndPublishDockerImages: false
      buildAndPublishHelmCharts: false
      publishToNuget: false
      executeSonar: true
    ${{ elseif eq(variables['Build.SourceBranchName'], 'main') }}:
      updateHelmConfig: true
      buildAndPublishDockerImages: true
      buildAndPublishHelmCharts: true
      publishToNuget: true
      executeSonar: true
    ${{ else }}:
      updateHelmConfig: true
      buildAndPublishDockerImages: true
      buildAndPublishHelmCharts: true
      publishToNuget: true
      executeSonar: false

    # notification_chart_version, not the generic chart_version -- platform-helm-config
    # hosts multiple independently-versioned OCI-chart apps sharing one flat
    # imageTags map per environment, so each app needs its own key to avoid
    # one app's publish overwriting another's chart-version pin.
    helmTagsCollection: "notification_api=$(build.buildnumber),notification_hub=$(build.buildnumber),notification_chart_version=$(build.buildnumber)"
